[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx/error.log
stdout_logfile=/var/log/nginx/access.log

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stderr_logfile=/var/log/php-fpm.log
stdout_logfile=/var/log/php-fpm.log

[program:queue]
command=php %(ENV_APP_DIR)s/artisan queue:work --sleep=3 --tries=3 --max-time=3600
user=www-data
process_name=%(program_name)s_%(process_num)02d
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/queue.log
stopwaitsecs=3600

[program:scheduler]
command=php %(ENV_APP_DIR)s/artisan schedule:work
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/scheduler.log

[program:inertia-ssr]
command=php %(ENV_APP_DIR)s/artisan inertia:start-ssr
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/inertia-ssr.log
stderr_logfile=/var/log/inertia-ssr.log

[program:nightwatch]
command=php %(ENV_APP_DIR)s/artisan nightwatch:agent
user=www-data
autostart=true
autorestart=true
stdout_logfile=/var/log/nightwatch.log
stderr_logfile=/var/log/nightwatch.log
